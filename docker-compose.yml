services:
  mysql:
    image: mysql:8.0
    container_name: dbms-lab-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dbmslab_root_pw}
      TZ: Asia/Kolkata
    command:
      # Match MySQL on Windows (what the lab machines run): table names are
      # stored in lowercase and compared case-insensitively.
      - --lower-case-table-names=1
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - dbms_lab_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  dbms_lab_mysql:
